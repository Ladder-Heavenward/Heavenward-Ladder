<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<link rel="stylesheet" href="rung.css">
<style>
.sd{max-width:720px;margin:0 auto;display:grid;gap:18px}
.sd .me{font-family:var(--mono);font-size:.9rem;background:var(--card);border:1px solid var(--grid);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.sd .me b{font-weight:500;color:var(--teal)}
.sd .tabs{display:flex;gap:8px}
.sd .tabs button{font-family:var(--mono);font-size:.85rem;padding:7px 14px;border:1px solid var(--grid);border-radius:999px;background:var(--sand);color:var(--ink);cursor:pointer}
.sd .tabs button[aria-selected=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.sd table{width:100%;border-collapse:collapse;font-size:.95rem}
.sd th{font-family:var(--mono);font-size:.72rem;font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid)}
.sd th:first-child,.sd td:first-child{width:3.2em}
.sd th:last-child,.sd td:last-child{text-align:right}
.sd td{padding:8px;border-bottom:1px solid var(--grid)}
.sd .empty{font-style:italic;color:var(--muted)}
/* 2026-11-12 (Andrew 21:35Z): the ellipsis of 'Connecting to server...' breathes, one dot after another */
.sd .conn .dots i{font-style:inherit;animation:sdconn 1.8s ease-in-out infinite}
.sd .conn .dots i:nth-child(2){animation-delay:.3s}
.sd .conn .dots i:nth-child(3){animation-delay:.6s}
@keyframes sdconn{0%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sd .conn .dots i{animation:none}}
/* standbots */
.sd td.who{overflow-wrap:anywhere}
.sd tr.bot td.who b{font-weight:400}
.sd .bottag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--grid);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.sd .did{display:block;font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-top:2px}
.sd tr.me td{background:color-mix(in srgb,var(--teal) 10%,transparent)}
.sd tr.me td.who b{color:var(--teal);font-weight:600}
.sd .botnote{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin:0}
.sd .conn .dots{display:inline;max-width:none}
.sd .conn .dots i{display:inline;width:auto;height:auto;background:none;border-radius:0;cursor:default}
.sd .roll{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin:0 0 6px}
</style>

<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#132a46"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ladder"><script>(function(){try{
/* 0.3.6 (Andrew 22:25): when the app opens, its icon's navy grows to the edges of the screen, the ladder loads behind it,
   then the navy draws back into the icon and the icon goes, showing the app. Once a session; never with reduced motion. */
if(sessionStorage.getItem('splash'))return;sessionStorage.setItem('splash','1');
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
var N='#132a46',S=112,d=document.createElement('div');d.id='splash';d.setAttribute('aria-hidden','true');
d.style.cssText='position:fixed;inset:0;z-index:2147483000;pointer-events:none;display:grid;place-items:center;background:transparent';
var f=document.createElement('div');f.style.cssText='position:absolute;left:50%;top:50%;width:'+S+'px;height:'+S+'px;margin:-'+S/2+'px 0 0 -'+S/2+'px;border-radius:22%;background:'+N+';will-change:transform';
var i=document.createElement('img');i.src='icons/icon-192.png';i.alt='';i.style.cssText='position:relative;width:'+S+'px;height:'+S+'px;border-radius:22%;display:block';
i.onerror=function(){i.style.visibility='hidden';};
d.appendChild(f);d.appendChild(i);document.documentElement.appendChild(d);
var cover=function(){var w=innerWidth,h=innerHeight;return Math.ceil(Math.sqrt(w*w+h*h)/S*1.08);};
var t0=Date.now(),grown=false,loaded=false,done=false;
var grow=f.animate([{transform:'scale(1)',borderRadius:'22%'},{transform:'scale('+cover()+')',borderRadius:'50%'}],{duration:520,delay:260,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'});
i.animate([{opacity:1},{opacity:1,offset:.45},{opacity:0}],{duration:780,fill:'forwards'});
var back=function(){if(done||!grown||!loaded)return;done=true;
  i.animate([{opacity:0},{opacity:1}],{duration:380,delay:300,fill:'forwards'});
  f.animate([{transform:'scale('+cover()+')',borderRadius:'50%'},{transform:'scale(1)',borderRadius:'22%'}],{duration:560,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'})
   .onfinish=function(){d.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.6)'}],{duration:260,delay:120,fill:'forwards'}).onfinish=function(){d.remove();};};};
grow.onfinish=function(){grown=true;back();};
var ld=function(){setTimeout(function(){loaded=true;back();},Math.max(0,700-(Date.now()-t0)));};
if(document.readyState==='complete')ld();else addEventListener('load',ld);
setTimeout(function(){loaded=true;grown=true;back();},4000);
}catch(e){}})();</script></head>
<body>
<div class="sd">
  <p class="home"><a href="index.html">← the ladder</a></p>
  <header style="display:grid;gap:8px">
    <div class="eyebrow">Standing · where the climbers stand</div>
    <h1>Standing</h1>
  </header>
  <p class="me">You climb as <b id="me"></b></p>
  <div class="tabs" role="tablist" aria-label="standing over">
    <button type="button" role="tab" id="t-day" aria-selected="true" aria-controls="p-day">Daily</button>
    <button type="button" role="tab" id="t-week" aria-selected="false" aria-controls="p-week">Weekly</button>
    <button type="button" role="tab" id="t-all" aria-selected="false" aria-controls="p-all">All Time</button>
  </div>
  <section id="p-day" role="tabpanel" aria-labelledby="t-day">
    <table><thead><tr><th>Place</th><th>Climber</th><th>Score</th></tr></thead><tbody></tbody></table>
    <p class="empty conn" role="status">Connecting to server<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
  </section>
  <section id="p-week" role="tabpanel" aria-labelledby="t-week" hidden>
    <table><thead><tr><th>Place</th><th>Climber</th><th>Score</th></tr></thead><tbody></tbody></table>
    <p class="empty conn" role="status">Connecting to server<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
  </section>
  <section id="p-all" role="tabpanel" aria-labelledby="t-all" hidden>
    <table><thead><tr><th>Place</th><th>Climber</th><th>Score</th></tr></thead><tbody></tbody></table>
    <p class="empty conn" role="status">Connecting to server<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
  </section>
</div>
<script src="ladmap.js"></script>
<script src="rung.js"></script>
<script>
(function(){
'use strict';
document.getElementById('me').textContent=window.LadderAccount?LadderAccount.name:'a climber with no name yet';
const tabs=[['t-day','p-day'],['t-week','p-week'],['t-all','p-all']];
function pick(k){ tabs.forEach(([t,p],i)=>{ document.getElementById(t).setAttribute('aria-selected',String(i===k)); document.getElementById(p).hidden=i!==k; });
  try{ sessionStorage.setItem('standing:tab2',String(k)); }catch(e){} }
tabs.forEach(([t],i)=>{ document.getElementById(t).onclick=()=>pick(i); });
let k=0; try{ k=+sessionStorage.getItem('standing:tab2')||0; }catch(e){} pick(k>=0&&k<3?k:0);

/* standbots (Andrew 2026-11-13 11:24Z): five bots on every climber's own boards, so there is always someone to beat.
   Each bot does its set work the second a board rolls over. Nothing is answered: the score is what that work would earn in
   the Laundry (understanding 1, proof 2, equation 3, word problem 4, one more per link, times the pools open at its rung),
   drawn a little differently each day from the climber's id, the bot and the date. A bot is told by its name: (bot) from (city). */
const BOTS=[
  {id:'android',name:'Android from Seattle',at:'the end',rung:99,n:25,kinds:['word'],does:'25 word problems'},
  {id:'robot',name:'Robot from Vancouver',at:'rung 47',rung:47,n:18,kinds:['word','work'],does:'18 word problems and equations'},
  {id:'synth',name:'Synth from San Fran',at:'rung 40',rung:40,n:15,kinds:['work','proof'],does:'15 equations and proofs'},
  {id:'waldo',name:'Waldo from Portland',at:'rung 30',rung:30,n:12,kinds:['proof'],does:'12 proofs'},
  {id:'drone',name:'Drone from Oakland',at:'rung 18',rung:18,n:10,kinds:['proof','read'],does:'10 proofs and understanding questions'}];
const PTS={read:1,proof:2,work:3,word:4};
/* the Laundry multiplies by 1 + (steps with pools switched on)/100; a bot has every pool up to its rung on */
const FALL={18:177,30:347,40:475,47:569,99:657};
function stepsTo(rung){ try{ const L=window.LADMAP; if(L){ let n=0; L.forEach(f=>f[1].forEach(r=>{ if(r[0]<=rung) n+=r[1].length; })); if(n) return n+(rung>47?88:0); } }catch(e){} return FALL[rung]||FALL[99]; }
function rng(seed){ let h=1779033703^seed.length; for(let i=0;i<seed.length;i++){ h=Math.imul(h^seed.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  let a=(h^=h>>>16)>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const r2=x=>Math.round(x*100)/100;
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const me=window.LadderAccount||{id:'none',name:'you',since:Date.now()};
function botDay(B,dk){ const R=rng(me.id+'|'+B.id+'|'+dk), m=1+stepsTo(B.rung)/100; let s=0;
  for(let i=0;i<B.n;i++){ const kind=B.kinds[Math.floor(R()*B.kinds.length)], links=kind==='read'?0:Math.floor(R()*3); s+=(PTS[kind]+links)*m; } return r2(s); }
const today=new Date(); today.setHours(0,0,0,0);
const monday=new Date(today); monday.setDate(today.getDate()-((today.getDay()+6)%7));
const first=new Date(Math.min(me.since||Date.now(),Date.now())); first.setHours(0,0,0,0);
function days(from){ const out=[], d=new Date(from); let guard=0; while(d<=today&&guard++<4000){ out.push(key(d)); d.setDate(d.getDate()+1); } return out; }
const SPAN={day:[key(today)],week:days(monday),all:days(first)};
let mine={}, total=0; try{ mine=JSON.parse(LS.getItem('rand:days')||'{}')||{}; }catch(e){} try{ total=+JSON.parse(LS.getItem('rand:score')||'0')||0; }catch(e){}
const myScore=span=>span==='all'?Math.max(total,r2(SPAN.all.reduce((s,d)=>s+(mine[d]||0),0))):r2(SPAN[span].reduce((s,d)=>s+(mine[d]||0),0));
const fmt=x=>x.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
/* window.LADDER_STANDING={day:[[name,score],...],week:[...],all:[...]} holds the other climbers once the server answers; they are mixed in with the bots */
const S=window.LADDER_STANDING||null;
[['day','p-day','Rolls over at midnight.'],['week','p-week','Rolls over on Monday.'],['all','p-all','']].forEach(([span,p,roll])=>{
  const sec=document.getElementById(p), tb=sec.querySelector('tbody'); tb.innerHTML='';
  const rows=BOTS.map(B=>({bot:B,name:B.name,score:r2(SPAN[span].reduce((s,d)=>s+botDay(B,d),0))}));
  rows.push({me:true,name:me.name,score:myScore(span)});
  if(S&&S[span]) S[span].forEach(r=>{ if(r[0]!==me.name) rows.push({name:r[0],score:+r[1]||0}); });
  rows.sort((a,b)=>b.score-a.score||(a.me?-1:1));
  rows.forEach((r,i)=>{ const tr=document.createElement('tr'); if(r.bot) tr.className='bot'; if(r.me) tr.className='me';
    const c1=document.createElement('td'); c1.textContent=i+1;
    const c2=document.createElement('td'); c2.className='who'; const b=document.createElement('b'); b.textContent=r.name; c2.appendChild(b);
    /* Andrew 11:29Z: no bot tag and no work shown; the name's own shape, (bot) from (city), marks a bot */
    if(r.me){ const d=document.createElement('span'); d.className='did'; d.textContent='you · your Laundry score'; c2.appendChild(d); }
    const c3=document.createElement('td'); c3.textContent=fmt(r.score); tr.append(c1,c2,c3); tb.appendChild(tr); });
  if(roll&&!sec.querySelector('.roll')){ const q=document.createElement('p'); q.className='roll'; q.textContent=roll; sec.insertBefore(q,sec.firstChild); }
  const conn=sec.querySelector('.empty'); if(conn) conn.hidden=!!S;
});
})();
</script>
<script src="app.js"></script><script src="app.js"></script></body>
</html>
